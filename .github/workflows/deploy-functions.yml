name: Deploy Cloud Functions & Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package.json

      - name: Install dependencies
        run: npm install
        working-directory: functions

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only functions,firestore:rules --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive --force
        working-directory: .
